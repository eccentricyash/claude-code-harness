name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The guards are the whole point. If a false positive creeps in, this
      # fails here rather than in daily use, where it would train you to
      # bypass your own control.
      - name: Guard fixtures
        run: python tests/test_guards.py

      - name: Stop-hook fixtures
        run: python tests/test_stop_hook.py

      - name: Loop-guard fixtures
        run: python tests/test_loop_guard.py

      - name: Verify-runner fixtures
        run: python tests/test_verify.py

      - name: Structure checks
        run: python tests/test_structure.py

      # Catches a renamed field or a manifest that stopped parsing after a
      # Claude Code update.
      - name: Validate plugin manifest
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate . --strict

      - name: Lint hook scripts
        run: |
          pip install ruff
          ruff check hooks/ skills/ tests/
